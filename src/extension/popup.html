<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Luyện Kanji - Chrome Extension</title>
  <style>
    body {
      width: 350px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #134e4a 100%);
      color: #ffffff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      background: #0d9488;
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 9999px;
      font-weight: 700;
    }
    .content {
      padding: 16px;
    }
    /* Snipping OCR Main Action Button */
    .btn-snip {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.35);
      transition: all 0.15s ease;
      margin-bottom: 14px;
    }
    .btn-snip:hover {
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      transform: translateY(-1px);
    }
    .btn-snip .shortcut-hint {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* Search Box */
    .search-label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2);
    }
    .btn-search {
      padding: 8px 14px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-search:hover {
      background: #1e293b;
    }

    .divider {
      height: 1px;
      background: #f1f5f9;
      margin: 12px 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 12px;
      color: #334155;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0d9488;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .footer {
      padding: 10px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #64748b;
    }
    .footer a {
      color: #0d9488;
      text-decoration: none;
      font-weight: 700;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>⛩️ Luyện Kanji <span class="badge">v2.1</span></h2>
    <span style="font-size: 11px; color: #99f6e4;">Extension</span>
  </div>

  <div class="content">
    <!-- Screen Snipping OCR Trigger Button -->
    <button class="btn-snip" id="btn-snip-capture" title="Khoanh vùng chụp một khu vực trên màn hình để quét Kanji bằng OCR">
      <span>📸 Khoanh vùng quét Kanji</span>
      <span class="shortcut-hint">Ctrl+Shift+K</span>
    </button>

    <!-- Unified Search Box -->
    <div class="search-label">
      <span>TRA CỨU NHANH KANJI</span>
      <span style="font-weight: normal; font-size: 10px; color: #94a3b8;">Nhập chữ Hán hoặc từ vựng</span>
    </div>
    <div class="search-box">
      <input type="text" id="quick-search-input" placeholder="Ví dụ: 日本語, 勉強, 駅..." autofocus>
      <button class="btn-search" id="quick-search-btn">Tra</button>
    </div>

    <div class="divider"></div>

    <div style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase;">
      Tùy chọn hiển thị
    </div>
    
    <div class="setting-row">
      <span>Nút nổi Tra Kanji khi bôi đen</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-tooltip" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>Tự động phát âm khi mở từ</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-autospeech">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    <span>Luyện Kanji Pro</span>
    <a href="#" id="open-web-app">🌐 Mở Web App đầy đủ ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
