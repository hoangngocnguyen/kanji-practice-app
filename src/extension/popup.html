<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Luyện Kanji - Chrome Extension</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }
    .header {
      background: #0f172a;
      color: #ffffff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      background: #0284c7;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .content {
      padding: 16px;
    }
    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }
    button {
      padding: 8px 12px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #0369a1;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
      color: #334155;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0284c7;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .footer {
      padding: 12px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      text-align: center;
      color: #64748b;
    }
    .footer a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>⛩️ Luyện Kanji <span class="badge">v1.0</span></h2>
  </div>

  <div class="content">
    <div class="search-box">
      <input type="text" id="quick-search-input" placeholder="Nhập Kanji hoặc câu tiếng Nhật...">
      <button id="quick-search-btn">Tra cứu</button>
    </div>

    <div style="font-size:12px; font-weight:700; color:#64748b; margin-top:12px; margin-bottom:6px; text-transform:uppercase;">Cài đặt tiện ích</div>
    
    <div class="setting-row">
      <span>Nút nổi Tra Kanji (Floating Tooltip)</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-tooltip" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>Tự động phát âm khi tra cứu</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-autospeech">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    Truy cập Web Playground: <a href="#" id="open-web-app">Luyện Kanji Web App</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
